<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Acme Consulting</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Acme Consulting</a>
      <button class="nav-toggle" aria-label="Open navigation">☰</button>
      <nav class="nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <form id="contactForm" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" required minlength="2">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required minlength="10"></textarea>

      <div class="form-actions">
        <button type="submit" class="btn">Send Message</button>
      </div>
      <div id="formFeedback" role="status" aria-live="polite"></div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Acme Consulting</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
